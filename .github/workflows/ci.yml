name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - run: bunx tsc -b
      - run: bun run test

  # The committed OpenAPI document and TS client must match the Go code.
  generated-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - run: cd web && bun install --frozen-lockfile
      - run: make gen
      - run: git diff --exit-code -- api/openapi.json web/src/api/ internal/store/sqlcdb/

  image:
    runs-on: ubuntu-latest
    needs: [go, web, generated-client]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/magne4000/easy-pz-docker
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          build-args: VERSION=${{ github.ref_name }}
          # Published on tags only, never on branch pushes.
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Static pzman binaries for the Pelican plugin (release assets contract in
  # PELICAN_PLAN.md); the launcher workflow adds its own assets to the same release.
  release:
    runs-on: ubuntu-latest
    needs: [go, web, generated-client]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - run: cd web && bun install --frozen-lockfile
      - run: make build-ui
      - name: Build pzman-linux-{amd64,arm64}
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o dist/pzman-linux-$arch ./cmd/pzman
          done
          cd dist && sha256sum pzman-linux-* > pzman-SHA256SUMS && cat pzman-SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pzman-linux-amd64
            dist/pzman-linux-arm64
            dist/pzman-SHA256SUMS
